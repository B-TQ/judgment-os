name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python judgment.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_skills.py .agents/skills/judgment-preserver/SKILL.md --strict-metadata
      - run: python judgment.py demo --out runs/ci-tutorial
      - run: python judgment.py selftest --out runs/ci-smoke
      - run: python judgment.py release --check
      - run: git diff --exit-code
