<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="demo.zh-CN-title demo.zh-CN-desc"><title id="demo.zh-CN-title">Judgment OS / 离线检查演示</title><desc id="demo.zh-CN-desc">Actual validator outcomes: incorrect fixture fails, correct fixture passes; no model efficacy implication.</desc><defs><style>text{font-family:Arial,"Microsoft YaHei",sans-serif} .mono{font-family:Consolas,monospace}</style><marker id="demo.zh-CN-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#777c85"/></marker></defs><rect width="1280" height="640" fill="#f7f7f3"/><text x="56" y="64" font-size="20" fill="#606875" font-weight="600" text-anchor="start">真实离线检查 / 人工软件示例</text><text x="56" y="128" font-size="44" fill="#17191d" font-weight="700" text-anchor="start">别把取消订单算进去。</text><text x="56" y="180" font-size="24" fill="#606875" font-weight="400" text-anchor="start">4 已支付 + 7 已支付；9 已取消 → total 11, count 2</text><rect x="56" y="228" width="568" height="252" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="80" y="272" font-size="20" fill="#606875" font-weight="600" text-anchor="start">错误示例</text><text x="80" y="332" font-size="28" fill="#17191d" font-weight="600" text-anchor="start">{&quot;total&quot;:20,&quot;count&quot;:3}</text><text x="80" y="396" font-size="32" fill="#17191d" font-weight="700" text-anchor="start">FAIL / exit 1</text><text x="80" y="448" font-size="20" fill="#606875" font-weight="400" text-anchor="start">错误计入已取消订单</text><rect x="656" y="228" width="568" height="252" rx="8" fill="#fff" stroke="#386cf0"/><text x="680" y="272" font-size="20" fill="#606875" font-weight="600" text-anchor="start">正确示例</text><text x="680" y="332" font-size="28" fill="#17191d" font-weight="600" text-anchor="start">{&quot;total&quot;:11,&quot;count&quot;:2}</text><text x="680" y="396" font-size="32" fill="#294b9d" font-weight="700" text-anchor="start">PASS / exit 0</text><text x="680" y="448" font-size="20" fill="#606875" font-weight="400" text-anchor="start">只统计已支付订单</text><text x="56" y="540" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">不代表模型前后效果，也不证明元 Skill 提升能力。</text><text x="56" y="592" font-size="20" fill="#606875" font-weight="400" text-anchor="start">复现命令：docs/launch/DEMO.md</text></svg>
