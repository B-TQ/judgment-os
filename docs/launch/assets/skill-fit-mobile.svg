<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1088" viewBox="0 0 720 1088" role="img" aria-labelledby="skill-fit-mobile-title skill-fit-mobile-desc"><title id="skill-fit-mobile-title">Skill fit / Concept illustration</title><desc id="skill-fit-mobile-desc">A fictional notice scenario contrasts an optional report template with bounded adaptation; no model outputs or measured improvements.</desc><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="720" height="1088" fill="#f7f7f3"/><text x="40" y="64" font-size="28" fill="#596270" font-weight="600">CONCEPT / NOT MEASURED OUTPUTS</text><text x="40" y="128" font-size="36" fill="#171b23" font-weight="700">Keep the rules.</text><text x="40" y="176" font-size="36" fill="#171b23" font-weight="700">Reconsider the template.</text><rect x="40" y="208" width="640" height="156" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="252" font-size="28" fill="#171b23" font-weight="600">USER GOAL</text><text x="64" y="296" font-size="28" fill="#596270" font-weight="400">A short incident notice for a phone</text><text x="64" y="336" font-size="28" fill="#596270" font-weight="400">Impact, action, owner, next update</text><rect x="40" y="388" width="640" height="204" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="432" font-size="28" fill="#171b23" font-weight="600">DOMAIN SKILL: OPTIONAL DEFAULT</text><text x="64" y="476" font-size="28" fill="#596270" font-weight="400">A full postmortem report</text><text x="64" y="516" font-size="28" fill="#596270" font-weight="400">Summary → timeline → cause → actions</text><text x="64" y="556" font-size="28" fill="#596270" font-weight="400">Risk: irrelevant sections or invented facts</text><rect x="40" y="616" width="640" height="204" rx="8" fill="#edf2ff" stroke="#365fc1" stroke-width="2"/><text x="64" y="660" font-size="28" fill="#365fc1" font-weight="600">GUIDANCE INTENT, NOT A RESULT</text><text x="64" y="704" font-size="28" fill="#596270" font-weight="400">If optional, choose a compact notice</text><text x="64" y="744" font-size="28" fill="#596270" font-weight="400">Keep expertise; do not invent a cause</text><text x="64" y="784" font-size="28" fill="#596270" font-weight="400">Do not downgrade mandatory steps</text><rect x="40" y="844" width="640" height="156" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="888" font-size="28" fill="#171b23" font-weight="600">WHAT STAYS BINDING</text><text x="64" y="932" font-size="28" fill="#596270" font-weight="400">Word limit · facts · required fields</text><text x="64" y="972" font-size="28" fill="#596270" font-weight="400">Permissions · mandatory approval</text><text x="40" y="1048" font-size="28" fill="#596270" font-weight="400">No new authority. No efficacy promise.</text></svg>
