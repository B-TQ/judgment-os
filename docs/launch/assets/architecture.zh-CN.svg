<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture.zh-CN-title architecture.zh-CN-desc"><title id="architecture.zh-CN-title">Judgment OS / 实现架构</title><desc id="architecture.zh-CN-desc">Shared requirements flow through collection, deterministic validation, separate review and reporting; optional Skill is guidance only.</desc><defs><style>text{font-family:Arial,"Microsoft YaHei",sans-serif} .mono{font-family:Consolas,monospace}</style><marker id="architecture.zh-CN-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#777c85"/></marker></defs><rect width="1280" height="720" fill="#f7f7f3"/><text x="56" y="64" font-size="20" fill="#606875" font-weight="600" text-anchor="start">实现架构 / v0.7</text><text x="56" y="124" font-size="40" fill="#17191d" font-weight="700" text-anchor="start">固定要求，收集回答，再验证结果</text><path d="M392 256H464" fill="none" stroke="#777c85" stroke-width="2" marker-end="url(#architecture.zh-CN-arrow)"/><path d="M808 256H880" fill="none" stroke="#777c85" stroke-width="2" marker-end="url(#architecture.zh-CN-arrow)"/><path d="M1056 324V352Q1056 360 1048 360H648Q640 360 640 368V404" fill="none" stroke="#777c85" stroke-width="2" marker-end="url(#architecture.zh-CN-arrow)"/><path d="M808 476H880" fill="none" stroke="#777c85" stroke-width="2" marker-end="url(#architecture.zh-CN-arrow)"/><rect x="56" y="188" width="336" height="136" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="76" y="228" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">冻结任务与条件</text><text x="76" y="268" font-size="16" fill="#606875" font-weight="400" text-anchor="start">共同硬要求 · A/B/C/D</text><text x="76" y="300" font-size="16" fill="#606875" font-weight="400" text-anchor="start">benchmark.py</text><rect x="472" y="188" width="336" height="136" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="492" y="228" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">收集真实输出</text><text x="492" y="268" font-size="16" fill="#606875" font-weight="400" text-anchor="start">默认只生成计划</text><text x="492" y="300" font-size="16" fill="#606875" font-weight="400" text-anchor="start">codex_adapter.py</text><rect x="888" y="188" width="336" height="136" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="908" y="228" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">检查声明属性</text><text x="908" y="268" font-size="16" fill="#606875" font-weight="400" text-anchor="start">文本检查与哈希完整性</text><text x="908" y="300" font-size="16" fill="#606875" font-weight="400" text-anchor="start">validators.py</text><rect x="472" y="408" width="336" height="136" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="492" y="448" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">匿名编号与评审</text><text x="492" y="488" font-size="16" fill="#606875" font-weight="400" text-anchor="start">映射私密 · 评审轮次分开</text><text x="492" y="520" font-size="16" fill="#606875" font-weight="400" text-anchor="start">review.py / paired_review.py</text><rect x="888" y="408" width="336" height="136" rx="8" fill="#fff" stroke="#cdd0d5"/><text x="908" y="448" font-size="24" fill="#17191d" font-weight="600" text-anchor="start">报告与采用决定</text><text x="908" y="488" font-size="16" fill="#606875" font-weight="400" text-anchor="start">保留失败、缺失和分歧</text><text x="908" y="520" font-size="16" fill="#606875" font-weight="400" text-anchor="start">reporting.py / paired_review.py</text><rect x="56" y="408" width="336" height="136" rx="8" fill="#edf1ff" stroke="#386cf0" stroke-dasharray="4 4"/><text x="76" y="448" font-size="20" fill="#294b9d" font-weight="600" text-anchor="start">可选：Judgment Preserver</text><text x="76" y="484" font-size="16" fill="#294b9d" font-weight="400" text-anchor="start">在硬要求内适配可选默认</text><text x="76" y="520" font-size="16" fill="#294b9d" font-weight="400" text-anchor="start">自然语言指导，不是权限引擎</text><path d="M56 592H1224" stroke="#d2d4d8"/><text x="56" y="636" font-size="20" fill="#606875" font-weight="400" text-anchor="start">图中方框对应已实现流程；可选 Skill 不强制模型行为。</text><text x="56" y="676" font-size="16" fill="#606875" font-weight="400" text-anchor="start">没有自动约束裁决器 · 未声明通用效果提升</text></svg>
