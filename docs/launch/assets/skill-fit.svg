<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="skill-fit-title skill-fit-desc"><title id="skill-fit-title">Skill fit / Concept illustration</title><desc id="skill-fit-desc">A fictional notice scenario contrasts an optional report template with bounded adaptation while retaining all binding requirements.</desc><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="1200" height="640" fill="#f7f7f3"/><text x="48" y="56" font-size="20" fill="#596270" font-weight="600">CONCEPT ILLUSTRATION / NOT MEASURED MODEL OUTPUTS</text><text x="48" y="112" font-size="36" fill="#171b23" font-weight="700">Keep the requirements. Reconsider the template.</text><rect x="48" y="152" width="1104" height="92" rx="8" fill="#fff" stroke="#cdd3db"/><text x="72" y="188" font-size="20" fill="#596270" font-weight="600">USER GOAL</text><text x="72" y="224" font-size="24" fill="#171b23" font-weight="400">A short phone notice: impact, next action, owner, next update.</text><rect x="48" y="280" width="528" height="188" rx="8" fill="#fff" stroke="#cdd3db"/><rect x="624" y="280" width="528" height="188" rx="8" fill="#edf2ff" stroke="#365fc1"/><text x="72" y="320" font-size="20" fill="#596270" font-weight="600">DOMAIN SKILL: OPTIONAL DEFAULT</text><text x="72" y="364" font-size="28" fill="#171b23" font-weight="600">Full postmortem report</text><text x="72" y="408" font-size="20" fill="#596270" font-weight="400">Summary → timeline → cause → actions</text><text x="72" y="444" font-size="20" fill="#596270" font-weight="400">Risk: irrelevant sections or invented facts.</text><text x="648" y="320" font-size="20" fill="#365fc1" font-weight="600">GUIDANCE INTENT, NOT A RESULT</text><text x="648" y="364" font-size="24" fill="#171b23" font-weight="600">If optional, choose a compact notice.</text><text x="648" y="408" font-size="20" fill="#596270" font-weight="400">Keep expertise; do not invent a root cause.</text><text x="648" y="444" font-size="20" fill="#596270" font-weight="400">Never downgrade a mandatory step.</text><path d="M48 512H1152" stroke="#cdd3db"/><text x="48" y="552" font-size="24" fill="#171b23" font-weight="600">Still binding: word limit, supplied facts, required fields, permissions, approval.</text><text x="48" y="600" font-size="20" fill="#596270" font-weight="400">A fictional scenario explaining guidance—not before/after evidence.</text></svg>
