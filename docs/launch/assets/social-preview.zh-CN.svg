<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="social-preview.zh-CN-title social-preview.zh-CN-desc"><title id="social-preview.zh-CN-title">Judgment OS / 中文发布封面</title><desc id="social-preview.zh-CN-desc">A design principle, not a claim of proven model improvement.</desc><defs><style>text{font-family:Arial,"Microsoft YaHei",sans-serif} .mono{font-family:Consolas,monospace}</style><marker id="social-preview.zh-CN-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#777c85"/></marker></defs><rect width="1280" height="640" fill="#111317"/><text x="64" y="76" font-size="20" fill="#a7adb8" font-weight="600" text-anchor="start">JUDGMENT OS / v0.7</text><text x="64" y="204" font-size="76" fill="#f7f7f3" font-weight="700" text-anchor="start">Judgment OS</text><text x="64" y="292" font-size="36" fill="#f7f7f3" font-weight="500" text-anchor="start">Skill 应扩展智能，</text><text x="64" y="344" font-size="36" fill="#f7f7f3" font-weight="500" text-anchor="start">而不是限制它。</text><text x="64" y="420" font-size="24" fill="#a7adb8" font-weight="400" text-anchor="start">用对照实验，看看指导到底改变了什么。</text><text x="64" y="464" font-size="20" fill="#a7adb8" font-weight="400" text-anchor="start">离线评测工具 · 可选实验 Skill</text><rect x="900" y="132" width="300" height="300" rx="8" fill="none" stroke="#7a808b" stroke-width="2"/><rect x="932" y="164" width="164" height="232" fill="none" stroke="#515762" stroke-width="2" stroke-dasharray="8 8"/><path d="M980 340H1032V296H1148V228" fill="none" stroke="#7b9dff" stroke-width="4"/><circle cx="1148" cy="228" r="8" fill="#7b9dff"/><text x="900" y="480" font-size="20" fill="#7b9dff" font-weight="400" text-anchor="start">硬性要求内的选择空间</text><path d="M64 540H1216" stroke="#363b43"/><text x="64" y="584" font-size="20" fill="#f7f7f3" font-weight="400" text-anchor="start">github.com/B-TQ/judgment-os</text><text x="1216" y="584