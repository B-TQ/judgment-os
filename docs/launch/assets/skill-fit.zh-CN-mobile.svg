<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1064" viewBox="0 0 720 1064" role="img" aria-labelledby="skill-fit-zh-CN-mobile-title skill-fit-zh-CN-mobile-desc"><title id="skill-fit-zh-CN-mobile-title">Skill fit / 概念演示</title><desc id="skill-fit-zh-CN-mobile-desc">A fictional notice scenario contrasts an optional report template with bounded adaptation; no model outputs or measured improvements.</desc><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="720" height="1064" fill="#f7f7f3"/><text x="40" y="64" font-size="28" fill="#596270" font-weight="600">概念演示 / 非模型实测</text><text x="40" y="128" font-size="36" fill="#171b23" font-weight="700">守住要求，重新考虑模板。</text><rect x="40" y="184" width="640" height="156" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="228" font-size="28" fill="#171b23" font-weight="600">用户目标</text><text x="64" y="272" font-size="28" fill="#596270" font-weight="400">手机上快速看懂的故障通知</text><text x="64" y="312" font-size="28" fill="#596270" font-weight="400">影响、下一步、负责人、更新时间</text><rect x="40" y="364" width="640" height="204" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="408" font-size="28" fill="#171b23" font-weight="600">领域 Skill：可选默认</text><text x="64" y="452" font-size="28" fill="#596270" font-weight="400">完整的事后复盘报告</text><text x="64" y="492" font-size="28" fill="#596270" font-weight="400">摘要 → 时间线 → 根因 → 行动项</text><text x="64" y="532" font-size="28" fill="#596270" font-weight="400">风险：无关章节或补写未知事实</text><rect x="40" y="592" width="640" height="204" rx="8" fill="#edf2ff" stroke="#365fc1" stroke-width="2"/><text x="64" y="636" font-size="28" fill="#365fc1" font-weight="600">指导意图，不是观测结果</text><text x="64" y="680" font-size="28" fill="#596270" font-weight="400">模板确实可选时，选紧凑通知</text><text x="64" y="720" font-size="28" fill="#596270" font-weight="400">保留专业知识，不为填表编造根因</text><text x="64" y="760" font-size="28" fill="#596270" font-weight="400">不把强制流程降为建议</text><rect x="40" y="820" width="640" height="156" rx="8" fill="#fff" stroke="#cdd3db" stroke-width="2"/><text x="64" y="864" font-size="28" fill="#171b23" font-weight="600">不能改变的要求</text><text x="64" y="908" font-size="28" fill="#596270" font-weight="400">字数上限 · 已知事实 · 必填信息</text><text x="64" y="948" font-size="28" fill="#596270" font-weight="400">权限 · 发送前必须取得的审批</text><text x="40" y="1024" font-size="28" fill="#596270" font-weight="400">不授予新权限，不承诺能力提升。</text></svg>
