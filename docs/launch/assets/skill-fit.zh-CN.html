<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Skill fit / 概念演示</title><style>html,body{margin:0;background:#f7f7f3}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="skill-fit-zh-CN-title skill-fit-zh-CN-desc"><title id="skill-fit-zh-CN-title">Skill fit / 概念演示</title><desc id="skill-fit-zh-CN-desc">A fictional notice scenario contrasts an optional report template with bounded adaptation while retaining all binding requirements.</desc><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="1200" height="640" fill="#f7f7f3"/><text x="48" y="56" font-size="20" fill="#596270" font-weight="600">概念演示 / 非模型实测</text><text x="48" y="112" font-size="36" fill="#171b23" font-weight="700">守住要求，重新考虑模板。</text><rect x="48" y="152" width="1104" height="92" rx="8" fill="#fff" stroke="#cdd3db"/><text x="72" y="188" font-size="20" fill="#596270" font-weight="600">用户目标</text><text x="72" y="224" font-size="24" fill="#171b23" font-weight="400">手机短通知：影响、下一步、负责人、下次更新时间。</text><rect x="48" y="280" width="528" height="188" rx="8" fill="#fff" stroke="#cdd3db"/><rect x="624" y="280" width="528" height="188" rx="8" fill="#edf2ff" stroke="#365fc1"/><text x="72" y="320" font-size="20" fill="#596270" font-weight="600">领域 Skill：可选默认</text><text x="72" y="364" font-size="28" fill="#171b23" font-weight="600">完整事后复盘报告</text><text x="72" y="408" font-size="20" fill="#596270" font-weight="400">摘要 → 时间线 → 根因 → 行动项</text><text x="72" y="444" font-size="20" fill="#596270" font-weight="400">风险：无关章节，或为填表补写未知事实。</text><text x="648" y="320" font-size="20" fill="#365fc1" font-weight="600">指导意图，不是观测结果</text><text x="648" y="364" font-size="24" fill="#171b23" font-weight="600">模板确实可选时，选紧凑通知。</text><text x="648" y="408" font-size="20" fill="#596270" font-weight="400">保留知识；不编造根因来填满模板。</text><text x="648" y="444" font-size="20" fill="#596270" font-weight="400">不把强制流程降为建议。</text><path d="M48 512H1152" stroke="#cdd3db"/><text x="48" y="552" font-size="24" fill="#171b23" font-weight="600">仍须遵守：字数上限、事实、必填信息、权限与强制审批。</text><text x="48" y="600" font-size="20" fill="#596270" font-weight="400">这是指导原则的概念示例，不是模型前后效果证明。</text></svg></html>
